<div class="container-fluid py-4">
  <h2 class="mb-4"><i class="fas fa-users-cog me-2"></i>Gestion des utilisateurs</h2>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="card shadow-sm" *ngIf="!loading && !error">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Nom d'utilisateur</th>
            <th>Email</th>
            <th>Rôles</th>
            <th>Département</th>
            <th>Famille de métier (managers)</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
              <span class="badge bg-secondary me-1" *ngFor="let role of user.roles">{{ role }}</span>
            </td>
            <td>
              <select class="form-select form-select-sm" style="max-width: 220px;"
                      [value]="user.departmentId || ''"
                      (change)="onDepartmentChange(user, $event)">
                <option value="">-- Aucun --</option>
                <option *ngFor="let dept of departments" [value]="dept.id">{{ dept.name }} ({{ dept.code }})</option>
              </select>
            </td>
            <td>
              <select *ngIf="isManager(user)" class="form-select form-select-sm" style="max-width: 220px;"
                      [value]="user.jobFamily || ''"
                      (change)="onJobFamilyChange(user, $event)"
                      title="Les dossiers validés RH pour cette famille de métier seront envoyés automatiquement à ce manager">
                <option value="">-- Aucune --</option>
                <option value="CS">CS (Consultant / Customer Success)</option>
                <option value="PRODOPS">ProdOps</option>
                <option value="RSD">RSD</option>
                <option value="OTHER">Autre</option>
              </select>
              <span *ngIf="!isManager(user)" class="text-muted small">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="container-fluid py-4">
  <h2 class="mb-4"><i class="fas fa-columns me-2"></i>Pipeline de recrutement</h2>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="kanban-board" *ngIf="!loading && !error">
    <div class="kanban-column" *ngFor="let column of columns">
      <div class="kanban-column-header" [title]="column.note || ''">
        <span>{{ column.label }}</span>
        <span class="badge bg-secondary">{{ column.candidates.length }}</span>
      </div>

      <div
        class="kanban-column-body"
        cdkDropList
        [id]="column.status"
        [cdkDropListData]="column.candidates"
        [cdkDropListConnectedTo]="getConnectedLists()"
        (cdkDropListDropped)="drop($event, column)">

        <div class="kanban-card" *ngFor="let candidate of column.candidates" cdkDrag
             [cdkDragDisabled]="estGlissementInterdit(candidate)">
          <div class="kanban-card-name">{{ candidate.firstName }} {{ candidate.lastName }}</div>
          <div class="kanban-card-offer text-muted small">{{ candidate.jobOfferTitle }}</div>
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-1 mt-2">
            <span class="badge" [ngClass]="getAiScoreBadgeClass(scoreRetenu(candidate))" [title]="scoreTitre(candidate)">
              Score retenu : {{ scoreRetenu(candidate) ?? '—' }}
            </span>
            <span class="badge bg-light text-dark border" *ngIf="afficheStatutExact(candidate)">
              {{ statutLabel(candidate) }}
            </span>
            <span class="badge bg-warning text-dark" *ngIf="candidate.needsHumanReview"
                  [title]="candidate.humanReviewReason || 'Décision humaine requise avant poursuite'">
              <i class="fas fa-exclamation-triangle me-1"></i>Arbitrage RH
            </span>
          </div>
        </div>

        <div class="kanban-empty text-muted small" *ngIf="column.candidates.length === 0">
          Aucun candidat
        </div>
      </div>
    </div>
  </div>
</div>

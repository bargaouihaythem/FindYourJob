<div class="internal-notes">
  <h6 class="text-primary mb-3">
    <i class="fas fa-eye-slash me-2"></i>
    Notes internes <span class="badge bg-secondary ms-1">RH/Admin uniquement</span>
  </h6>

  <div class="input-group mb-3">
    <textarea class="form-control" rows="2" placeholder="Ajouter une note interne (non visible par le candidat)..."
              [(ngModel)]="newNoteContent"></textarea>
    <button class="btn btn-primary" type="button" [disabled]="!newNoteContent.trim()" (click)="addNote()">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <div *ngIf="loading" class="text-muted small">Chargement...</div>

  <div *ngIf="!loading && notes.length === 0" class="text-muted small fst-italic">
    Aucune note interne pour ce candidat.
  </div>

  <div class="note-card mb-2" *ngFor="let note of notes" [class.pinned]="note.pinned">
    <div class="d-flex justify-content-between align-items-start">
      <div class="flex-grow-1">
        <ng-container *ngIf="editingId !== note.id">
          <p class="mb-1 note-content">{{ note.content }}</p>
        </ng-container>
        <ng-container *ngIf="editingId === note.id">
          <textarea class="form-control mb-2" rows="2" [(ngModel)]="editingContent"></textarea>
          <button class="btn btn-sm btn-success me-1" (click)="saveEdit(note)">Enregistrer</button>
          <button class="btn btn-sm btn-outline-secondary" (click)="cancelEdit()">Annuler</button>
        </ng-container>
        <small class="text-muted">
          {{ note.createdBy || 'Inconnu' }} · {{ note.createdAt | date:'dd/MM/yyyy HH:mm' }}
          <span *ngIf="note.pinned" class="badge bg-warning text-dark ms-1">Épinglée</span>
        </small>
      </div>
      <div class="btn-group btn-group-sm ms-2" *ngIf="editingId !== note.id">
        <button class="btn btn-outline-secondary" title="Épingler" (click)="togglePin(note)">
          <i class="fas fa-thumbtack"></i>
        </button>
        <button class="btn btn-outline-secondary" title="Modifier" (click)="startEdit(note)">
          <i class="fas fa-pen"></i>
        </button>
        <button class="btn btn-outline-danger" title="Supprimer" (click)="deleteNote(note)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>

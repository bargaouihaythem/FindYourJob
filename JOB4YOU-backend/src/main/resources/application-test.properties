# Profil test/local live : H2 en mémoire, sans services externes.
spring.datasource.url=jdbc:h2:mem:job4you_live;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=${APP_TEST_JWT_SECRET:dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLWxvY2FsLXRlc3Rpbmc=}
app.jwt.expiration=86400000
app.email.enabled=${APP_EMAIL_ENABLED:false}

spring.mail.host=${SPRING_MAIL_HOST:127.0.0.1}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:no-reply@local.test}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.socketFactory.class=
spring.mail.properties.mail.smtp.socketFactory.port=
spring.mail.properties.mail.smtp.socketFactory.fallback=true
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:2000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:2000}

n8n.webhook.agent1=${N8N_WEBHOOK_AGENT1:}
n8n.webhook.agent2=${N8N_WEBHOOK_AGENT2:}
n8n.webhook.agent3=${N8N_WEBHOOK_AGENT3:}
n8n.api.key=${N8N_API_KEY:}
n8n.http.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:500}
n8n.http.read-timeout-ms=${N8N_READ_TIMEOUT_MS:1000}

cohere.api.token=${COHERE_API_KEY:}
app.init.create-default-users=false
app.init.create-job-offers=false
app.file.upload-dir=./test-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

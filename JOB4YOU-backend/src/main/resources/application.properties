# ============================================================
# Configuration n8n — 3 Agents IA de recrutement
# Remplir ces URLs après création des webhooks dans n8n
# ============================================================
# Agent 1 : CV Parser + Scoring IA
#           Déclencheur : nouvelle candidature (CandidateService.submitApplication)
n8n.webhook.agent1=http://localhost:5678/webhook/agent1-cv-parser

# Agent 2 : Planification entretien + Google Calendar + Email participants
#           Déclencheur : création d'entretien (InterviewService.scheduleInterview)
n8n.webhook.agent2=http://localhost:5678/webhook/agent2-entretien

# Agent 3 : RH → Manager (transmission du dossier validé + décision finale)
#           Déclencheur : RH change statut en CV_REVIEWED (CandidateService.updateCandidateStatus)
n8n.webhook.agent3=http://localhost:5678/webhook/agent3-rh-manager

# Clé API pour sécuriser l'endpoint GET /api/notifications/n8n/candidatures-du-jour (résumé quotidien)
# n8n doit envoyer cette valeur dans le header X-N8N-API-Key
n8n.api.key=job4you-secret-2026

# Timeouts HTTP pour les appels Spring Boot → n8n (en millisecondes)
# connect-timeout : délai max pour établir la connexion TCP
# read-timeout    : délai max pour recevoir la réponse après connexion
n8n.http.connect-timeout-ms=3000
n8n.http.read-timeout-ms=10000

# ============================================================
# Configuration Score IA par critères (technique / communication / séniorité)
# ============================================================
# Cle API HuggingFace — NE JAMAIS committer la vraie valeur ici.
# Definir la variable d'environnement HF_API_TOKEN (ex: setx HF_API_TOKEN "hf_xxx")
# Si vide/absente : mode simule (fallback) utilise automatiquement, aucun blocage.
# NOTE: api-inference.huggingface.co est bloque par le reseau Sopra Steria (DNS) — non utilise activement, remplace par Cohere ci-dessous.
huggingface.api.token=${HF_API_TOKEN:}
huggingface.api.url=https://api-inference.huggingface.co/models/facebook/bart-large-mnli
huggingface.http.connect-timeout-ms=5000
huggingface.http.read-timeout-ms=15000

# Cle API Cohere — NE JAMAIS committer la vraie valeur ici.
# Definir la variable d'environnement COHERE_API_KEY (ex: setx COHERE_API_KEY "xxx")
# api.cohere.com est accessible depuis le reseau Sopra Steria (verifie).
cohere.api.token=${COHERE_API_KEY:}
cohere.api.url=https://api.cohere.com/v2/chat
cohere.model=command-r-08-2024

# Ponderation des criteres de scoring (doit sommer a 1.0)
ai.score.weight.technical=0.5
ai.score.weight.communication=0.2
ai.score.weight.seniority=0.3

spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Configuration de l'application
app.email.enabled=true

# Initialisation des données par défaut (false = ne plus créer les utilisateurs par défaut au démarrage)
# Mettre à true uniquement pour la première initialisation
app.init.create-default-users=false

# Initialisation automatique des offres d'emploi au démarrage
# true = créer des offres d'emploi par défaut si aucune n'existe (PREMIER DÉMARRAGE SEULEMENT)
# false = ne pas créer d'offres automatiquement
app.init.create-job-offers=true

# Force la création des nouvelles offres même s'il y en a déjà
# true = ajouter les nouvelles offres à celles existantes (ATTENTION: duplique les données)
# false = créer seulement si aucune offre n'existe (RECOMMANDÉ POUR PRÉSERVER LES DONNÉES)
app.init.force-create-job-offers=false


# Configuration JOB4YOU
# Ne jamais placer de secrets réels dans ce fichier ou dans Git.
# Fournir les valeurs par variables d’environnement ou par application-local.properties.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job4you_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# En développement, "update" peut être utilisé temporairement.
# En production, utiliser une migration versionnée et définir JPA_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT : obligatoire pour un environnement réel.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# SMTP : désactivé par défaut si aucune configuration n’est fournie.
app.email.enabled=${APP_EMAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.socketFactory.port=${SPRING_MAIL_PORT:465}
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.auth.mechanisms=PLAIN
spring.mail.properties.mail.debug=false
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Webhooks n8n : optionnels en développement.
n8n.webhook.agent1=${N8N_WEBHOOK_AGENT1:http://localhost:5678/webhook/agent1-cv-parser}
n8n.webhook.agent2=${N8N_WEBHOOK_AGENT2:http://localhost:5678/webhook/agent2-entretien}
n8n.webhook.agent3=${N8N_WEBHOOK_AGENT3:http://localhost:5678/webhook/agent3-rh-manager}
n8n.api.key=${N8N_API_KEY:}
n8n.http.connect-timeout-ms=${N8N_CONNECT_TIMEOUT_MS:3000}
n8n.http.read-timeout-ms=${N8N_READ_TIMEOUT_MS:10000}
n8n.outbox.enabled=${N8N_OUTBOX_ENABLED:true}
n8n.outbox.poll-ms=${N8N_OUTBOX_POLL_MS:5000}

# Cohere : le token est uniquement lu depuis COHERE_API_KEY.
cohere.api.token=${COHERE_API_KEY:}
cohere.api.url=${COHERE_API_URL:https://api.cohere.com/v2/chat}
cohere.model=${COHERE_MODEL:command-a-03-2025}

# Configuration legacy conservée pour compatibilité ; HuggingFace n’est pas le moteur actif.
huggingface.api.token=${HF_API_TOKEN:}
huggingface.api.url=${HF_API_URL:https://api-inference.huggingface.co/models/facebook/bart-large-mnli}
huggingface.http.connect-timeout-ms=5000
huggingface.http.read-timeout-ms=15000

# Pondérations du scoring IA.
ai.score.weight.technical=${AI_SCORE_WEIGHT_TECHNICAL:0.5}
ai.score.weight.communication=${AI_SCORE_WEIGHT_COMMUNICATION:0.2}
ai.score.weight.seniority=${AI_SCORE_WEIGHT_SENIORITY:0.3}

# Initialisation et fichiers.
app.init.create-default-users=${APP_INIT_CREATE_DEFAULT_USERS:false}
app.init.create-job-offers=${APP_INIT_CREATE_JOB_OFFERS:false}
app.init.force-create-job-offers=false
app.file.upload-dir=${APP_FILE_UPLOAD_DIR:uploads/cvs}
app.file.base-url=${APP_FILE_BASE_URL:http://localhost:8080/api/files}

# Documentation et téléversement.
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:10MB}

# Actuator : exposition minimale pour les sondes de santé.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Logging de sécurité : éviter les logs verbeux en production.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

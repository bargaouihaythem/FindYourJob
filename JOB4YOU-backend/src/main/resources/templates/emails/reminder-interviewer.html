<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rappel d'entretien</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #1e3a8a; color: white; padding: 20px; text-align: center; border-radius: 5px 5px 0 0; }
        .content { background-color: #f8f9fa; padding: 30px; border-radius: 0 0 5px 5px; }
        .detail-row { margin: 8px 0; }
        .detail-label { font-weight: bold; display: inline-block; width: 100px; }
        .footer { text-align: center; margin-top: 20px; color: #6c757d; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header"><h2>⏰ Rappel — Entretien dans 2 heures</h2></div>
    <div class="content">
        <p>Bonjour <strong th:text="${interviewerName}">Interviewer</strong>,</p>
        <p>Rappel : vous avez un entretien avec <strong th:text="${candidateName}">Candidat</strong>
           pour le poste <strong th:text="${jobOfferTitle}">Poste</strong>.</p>
        <div class="detail-row"><span class="detail-label">Date :</span> <span th:text="${#temporals.format(interviewDate, 'dd/MM/yyyy')}">Date</span></div>
        <div class="detail-row"><span class="detail-label">Heure :</span> <span th:text="${#temporals.format(interviewDate, 'HH:mm')}">Heure</span></div>
        <div class="detail-row"><span class="detail-label">Lieu :</span> <span th:text="${location}">Lieu</span></div>
        <p>Cordialement,<br>L'équipe de recrutement JOB4YOU</p>
    </div>
    <div class="footer"><p>Rappel automatique — merci de ne pas répondre à cet e-mail.</p></div>
</body>
</html>

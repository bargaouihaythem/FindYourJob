# ============================================================
# Configuration de test (H2 en mémoire — remplace PostgreSQL)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT de test uniquement — ne jamais réutiliser en production
app.jwt.secret=${APP_TEST_JWT_SECRET:dGVzdC1vbmx5LWp3dC1zZWNyZXQtZm9yLWxvY2FsLXRlc3Rpbmc=}
app.jwt.expiration=86400000

# Désactiver l'envoi de vrais emails
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@test.com
spring.mail.password=${SPRING_TEST_MAIL_PASSWORD:}

# n8n désactivé en test (webhooks vides = no-op)
n8n.webhook.agent1=
n8n.webhook.agent2=
n8n.webhook.agent3=
n8n.http.connect-timeout-ms=1000
n8n.http.read-timeout-ms=2000

# Désactiver Cloudinary en test
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test

# Upload : dossier temporaire
file.upload-dir=./test-uploads
